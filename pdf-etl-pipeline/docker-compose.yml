services:
  postgres:
    image: postgres:16-alpine
    container_name: pdf_pipeline_db
    environment:
      POSTGRES_DB: pdf_metadata_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.8
    container_name: pdf_pipeline_s3
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=eu-west-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
  localstack_data: