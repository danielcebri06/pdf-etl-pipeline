spring.application.name=pdf-etl-pipeline

# 1. Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/pdf_metadata_db
spring.datasource.username=admin
spring.datasource.password=adminpassword

# Crea o actualiza las tablas automáticamente según las clases Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 2. Spring Batch: crea automáticamente las tablas de control de Jobs
spring.batch.jdbc.initialize-schema=always

# 3. Límite de tamaño para subir PDFs
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# 4. Conexión a S3 local con LocalStack (Capa Bronce)
minio.url=http://localhost:4566
minio.access-key=test
minio.secret-key=test
minio.bucket=pdf-bronze